{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Менеджер проектов{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a class="logo" href="{% url 'tasks:list' %}">TaskBoard</a>
            <nav>
                <a href="{% url 'tasks:list' %}">Проекты</a>
                {% if user.is_authenticated %}
                    <a class="button button-small" href="{% url 'tasks:project_create' %}">Создать проект</a>
                    <span class="nav-user">{{ user.username }}</span>
                    <form class="logout-form" action="{% url 'logout' %}?next={{ request.get_full_path|urlencode }}" method="post">
                        {% csrf_token %}
                        <button class="button button-small button-secondary" type="submit">Выйти</button>
                    </form>
                {% else %}
                    <a class="button button-small" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">Войти</a>
                    <a href="{% url 'accounts:create' %}?next={{ request.get_full_path|urlencode }}">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="container main">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <div class="container">Домашнее задание №59</div>
    </footer>
</body>
</html>
