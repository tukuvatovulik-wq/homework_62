{% extends "base.html" %}
{% block title %}Удаление проекта{% endblock %}
{% block content %}
<div class="form-wrap">
    <h1>Удалить проект?</h1>
    <p>Вы действительно хотите удалить проект «{{ object.name }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button class="button button-danger" type="submit">Удалить</button>
        <a class="back-link" href="{% url 'tasks:project_detail' object.pk %}">Отмена</a>
    </form>
</div>
{% endblock %}
