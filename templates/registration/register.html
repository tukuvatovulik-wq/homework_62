{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="detail-card">
<h1>Регистрация</h1>
<form method="post">{% csrf_token %}{% if request.GET.next %}<input type="hidden" name="next" value="{{ request.GET.next }}">{% endif %}
{{ form.as_p }}
<button class="button" type="submit">Зарегистрироваться</button>
</form>
<p>Уже есть аккаунт? <a href="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Войти</a></p>
</div>
{% endblock %}
